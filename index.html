<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Buddy</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #dff5ff; color: #17324d; }
    main { width: min(100%, 560px); text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 6vw, 2.6rem); }
    .help { margin: 0 0 14px; color: #385873; }
    .game-wrap { position: relative; overflow: hidden; border: 4px solid #fff; border-radius: 18px; box-shadow: 0 14px 35px #37618030; background: #8edbff; }
    canvas { display: block; width: 100%; height: auto; touch-action: manipulation; }
    .hud { position: absolute; inset: 12px 14px auto; display: flex; justify-content: space-between; align-items: center; pointer-events: none; font-weight: 800; text-shadow: 0 1px #fff; }
    .score { font-size: 1.4rem; }
    .status { min-height: 1.5em; font-size: .95rem; }
    button { border: 0; border-radius: 999px; padding: 11px 22px; background: #ffb833; color: #412b00; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #dc8f12; }
    button:hover { filter: brightness(1.04); }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #dc8f12; }
    .actions { margin-top: 12px; }
    footer { margin-top: 14px; color: #55738a; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>🐤 Flappy Buddy</h1>
    <p class="help">스페이스바를 눌러 날아오르고, 파이프 사이를 통과하세요!</p>
    <div class="game-wrap">
      <canvas id="game" width="520" height="620" aria-label="장애물을 피하는 Flappy Buddy 게임"></canvas>
      <div class="hud"><span class="score">점수 <span id="score">0</span></span><span id="best">최고 0</span></div>
    </div>
    <p class="status" id="status" aria-live="polite">스페이스바를 눌러 시작하세요</p>
    <div class="actions"><button id="restart" type="button">다시 시작</button></div>
    <footer>조작: 스페이스바 또는 화면 클릭 · 장애물 하나를 통과하면 1점</footer>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.querySelector('#score');
      const bestEl = document.querySelector('#best');
      const statusEl = document.querySelector('#status');
      const W = canvas.width, H = canvas.height;
      const groundH = 62;
      const bird = { x: 125, y: 260, r: 17, vy: 0 };
      const gravity = 0.34, flapPower = -6.5;
      const pipeWidth = 66, gap = 170, pipeSpeed = 2.5;
      let pipes = [], score = 0, state = 'ready', frame = 0;
      let best = Number(localStorage.getItem('flappyBuddyBest') || 0);
      bestEl.textContent = `최고 ${best}`;

      function setScore(value) { score = value; scoreEl.textContent = String(score); }
      function reset() {
        bird.y = 260; bird.vy = 0;
        pipes = [{ x: W + 40, gapY: 205, scored: false }];
        setScore(0); frame = 0; state = 'ready';
        statusEl.textContent = '스페이스바를 눌러 시작하세요';
        draw();
      }
      function startOrFlap() {
        if (state === 'over') return;
        if (state === 'ready') { state = 'playing'; statusEl.textContent = ''; }
        bird.vy = flapPower;
      }
      function endGame() {
        if (state !== 'playing') return;
        state = 'over';
        statusEl.textContent = `게임 종료! ${score}점 · 다시 시작을 눌러 도전하세요`;
      }
      function addPipe() {
        const margin = 82;
        const gapY = margin + Math.random() * (H - groundH - gap - margin * 2);
        pipes.push({ x: W + 20, gapY, scored: false });
      }
      function roundedRect(x, y, w, h, r, color) {
        ctx.fillStyle = color; ctx.beginPath();
        ctx.roundRect(x, y, w, h, r); ctx.fill();
      }
      function draw() {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#82d8ff'); sky.addColorStop(1, '#e8fbff');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        // Clouds
        for (const [x, y, s] of [[70,105,1],[330,160,.8],[430,75,.65]]) {
          ctx.fillStyle = '#ffffffb8';
          ctx.beginPath(); ctx.arc(x, y, 22*s, 0, Math.PI*2); ctx.arc(x+24*s, y-8*s, 28*s, 0, Math.PI*2); ctx.arc(x+52*s, y, 20*s, 0, Math.PI*2); ctx.fill();
        }
        for (const p of pipes) {
          const topH = p.gapY;
          const bottomY = p.gapY + gap;
          roundedRect(p.x, -8, pipeWidth, topH + 8, 9, '#35ad5b');
          roundedRect(p.x - 6, topH - 22, pipeWidth + 12, 24, 7, '#258a45');
          roundedRect(p.x, bottomY, pipeWidth, H - groundH - bottomY + 8, 9, '#35ad5b');
          roundedRect(p.x - 6, bottomY - 2, pipeWidth + 12, 24, 7, '#258a45');
          ctx.fillStyle = '#ffffff35'; ctx.fillRect(p.x + 10, 0, 7, Math.max(0, topH - 25));
          ctx.fillRect(p.x + 10, bottomY + 26, 7, Math.max(0, H - groundH - bottomY - 26));
        }
        ctx.fillStyle = '#9ad957'; ctx.fillRect(0, H-groundH, W, 12);
        ctx.fillStyle = '#d8ad68'; ctx.fillRect(0, H-groundH+12, W, groundH-12);
        ctx.fillStyle = '#c69350';
        for (let x = -((frame * pipeSpeed) % 34); x < W; x += 34) ctx.fillRect(x, H-groundH+28, 16, 4);
        // Buddy
        ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(Math.max(-.45, Math.min(.65, bird.vy * .055)));
        ctx.fillStyle = '#ffd348'; ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffb52e'; ctx.beginPath(); ctx.ellipse(-7, 5, 10, 6, -.35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7, -6, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#25364a'; ctx.beginPath(); ctx.arc(9, -6, 2.7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ff8155'; ctx.beginPath(); ctx.moveTo(14, 1); ctx.lineTo(27, 5); ctx.lineTo(14, 9); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      function update() {
        if (state === 'playing') {
          frame++;
          bird.vy += gravity; bird.y += bird.vy;
          for (const p of pipes) {
            p.x -= pipeSpeed;
            if (!p.scored && p.x + pipeWidth < bird.x) {
              p.scored = true;
              setScore(score + 1);
              if (score > best) { best = score; bestEl.textContent = `최고 ${best}`; localStorage.setItem('flappyBuddyBest', String(best)); }
            }
          }
          pipes = pipes.filter(p => p.x + pipeWidth > -10);
          if (pipes.length === 0 || pipes[pipes.length-1].x < W - 230) addPipe();
          if (bird.y - bird.r < 0 || bird.y + bird.r > H - groundH) endGame();
          for (const p of pipes) {
            const overlapsX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + pipeWidth;
            if (overlapsX && (bird.y - bird.r < p.gapY || bird.y + bird.r > p.gapY + gap)) endGame();
          }
        }
        draw();
        requestAnimationFrame(update);
      }
      document.addEventListener('keydown', event => {
        if (event.code === 'Space') { event.preventDefault(); startOrFlap(); }
      });
      canvas.addEventListener('pointerdown', startOrFlap);
      document.querySelector('#restart').addEventListener('click', reset);
      reset(); requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
